<ion-content class="dashboard-content" [fullscreen]="true">
  <div class="dashboard-wrapper">
    <div class="header">
      <h1>📊 Panel de Control</h1>
      <p>Bienvenido, {{ user?.fullName || 'Usuario' }}</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <ion-icon name="cash-outline" class="stat-icon revenue"></ion-icon>
        <div class="stat-info">
          <span class="stat-label">Ingresos Totales</span>
          <span class="stat-value">S/ 0.00</span>
        </div>
      </div>
      <div class="stat-card">
        <ion-icon name="cube-outline" class="stat-icon stock"></ion-icon>
        <div class="stat-info">
          <span class="stat-label">Stock Total</span>
          <span class="stat-value">0</span>
        </div>
      </div>
      <div class="stat-card">
        <ion-icon name="people-outline" class="stat-icon clients"></ion-icon>
        <div class="stat-info">
          <span class="stat-label">Clientes Activos</span>
          <span class="stat-value">0</span>
        </div>
      </div>
      <div class="stat-card">
        <ion-icon name="receipt-outline" class="stat-icon sales"></ion-icon>
        <div class="stat-info">
          <span class="stat-label">Ventas del Mes</span>
          <span class="stat-value">0</span>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h3>📈 Ventas Semanales</h3>
        <div class="chart-placeholder">
          <p>Gráfico de ventas</p>
        </div>
      </div>
      <div class="card">
        <h3>🏆 Producto Estrella</h3>
        <div class="star-product">
          <ion-icon name="star-outline" class="star-icon"></ion-icon>
          <p>No hay datos disponibles</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
