<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="list-outline" slot="start"></ion-icon>
      Historial de Ventas
    </ion-title>
    <ion-button slot="end" fill="clear" (click)="close()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Resumen de totales -->
  <div class="summary-card" *ngIf="ventas.length > 0">
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <div class="stat-item">
            <ion-icon name="cash-outline"></ion-icon>
            <span class="stat-label">Total ventas</span>
            <span class="stat-value">{{ ventas.length }}</span>
          </div>
        </ion-col>
        <ion-col size="6">
          <div class="stat-item">
            <ion-icon name="calculator-outline"></ion-icon>
            <span class="stat-label">Monto total</span>
            <span class="stat-value">S/ {{ totalMonto() | number: '1.2-2' }}</span>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Lista de ventas -->
  <div class="ventas-list" *ngIf="ventas.length > 0; else empty">
    <div class="venta-item" *ngFor="let venta of ventas">
      <div class="venta-header">
        <span class="venta-code">{{ venta.code }}</span>
        <ion-badge color="success">S/ {{ venta.total | number: '1.2-2' }}</ion-badge>
      </div>
      <div class="venta-details">
        <div class="venta-detail">
          <ion-icon name="person-outline"></ion-icon>
          <span>{{ venta.customerName }}</span>
        </div>
        <div class="venta-detail">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>{{ venta.createdAt | date: 'dd/MM/yyyy, h:mm a' }}</span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty-state">
      <ion-icon name="document-outline"></ion-icon>
      <p>No hay ventas registradas</p>
    </div>
  </ng-template>
</ion-content>
