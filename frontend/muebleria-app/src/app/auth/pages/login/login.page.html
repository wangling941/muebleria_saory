<ion-content class="login-content" [fullscreen]="true">
  <div class="login-wrapper">
    <div class="login-box">
      <!-- Brand -->
      <div class="brand">
        <div class="logo">
          <svg
            width="64"
            height="64"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0a5c2e"
            stroke-width="2.5"
          >
            <path d="M3 9L12 3L21 9L12 15L3 9Z" stroke="#0a5c2e" stroke-linejoin="round" />
            <path d="M3 15L12 21L21 15" stroke="#0a5c2e" stroke-linejoin="round" />
            <path d="M3 12L12 18L21 12" stroke="#0a5c2e" stroke-linejoin="round" />
          </svg>
        </div>
        <h1>Mueblería IGEN</h1>
        <p>Especialistas en muebles metálicos</p>
      </div>

      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label>Usuario o email</label>
          <div class="input-group">
            <span class="input-icon">
              <ion-icon name="person-outline"></ion-icon>
            </span>
            <input
              type="text"
              class="input-field"
              formControlName="identifier"
              placeholder="Ingresa tu usuario o email"
            />
          </div>
          <div
            class="error"
            *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid"
          >
            {{
              form.get('identifier')?.hasError('required')
                ? 'Campo requerido'
                : 'Mínimo 3 caracteres'
            }}
          </div>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <div class="input-group">
            <span class="input-icon">
              <ion-icon name="lock-closed-outline"></ion-icon>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="input-field"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
            />
            <button type="button" class="toggle-btn" (click)="togglePassword()">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            {{
              form.get('password')?.hasError('required') ? 'Campo requerido' : 'Mínimo 6 caracteres'
            }}
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" formControlName="remember" />
            <span>Recordarme</span>
          </label>
          <a routerLink="/auth/recover" class="forgot">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="error api-error" *ngIf="error">
          <ion-icon name="alert-circle-outline"></ion-icon> {{ error }}
        </div>

        <button type="submit" class="login-btn" [disabled]="form.invalid || loading">
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading">Ingresando...</span>
        </button>
      </form>
    </div>
  </div>
</ion-content>
